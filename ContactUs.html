<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
     <link rel="stylesheet" href="ContactUs.css" />
</head>
<body>
    <script src="ContactUs.js"></script>
     <main class="contact-section" role="main" aria-labelledby="contact-heading">
        <div class="container">

      <!-- LEFT: Contact info -->
      <section class="contact-info" aria-label="Contact information">
        <h3>Contact us</h3>
        <ul class="info-list">
          <li class="info-item">
           <div class="icon">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/>
    <circle cx="12" cy="10" r="3"/>
  </svg></div>
            <div class="meta">
              <strong>ADDRESS:</strong>
              123 Hospital St, City, Country
            </div>
          </li>

          <li class="info-item">
            <div class="icon">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.07 4.18 2 2 0 0 1 4.05 2h3a2 2 0 0 1 2 1.72c.12.81.37 1.6.72 2.34a2 2 0 0 1-.45 2.18L8 9a16 16 0 0 0 6 6l.76-.32a2 2 0 0 1 2.18.45c.74.35 1.53.6 2.34.72A2 2 0 0 1 22 16.92z"/>
  </svg>
</div>

            <div class="meta">
              <strong>PHONE:</strong>
             044-123-456
            </div>
          </li>

          <li class="info-item">
           <div class="icon">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
    <polyline points="22,6 12,13 2,6"/>
  </svg>
</div>

            <div class="meta">
              <strong>EMAIL:</strong>
             info@hospital.com
            </div>
          </li>

          <li class="info-item">
           <div class="icon">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <line x1="2" y1="12" x2="22" y2="12"/>
    <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/>
  </svg>
</div>

            <div class="meta">
              <strong>WEBSITE:</strong>
              NovaHealth-Hospital.com
            </div>
          </li>
        </ul>
      </section>

      <!-- RIGHT: Contact form card -->
      <aside class="contact-card" aria-label="Contact form">
        <h3 class="card-title">Get in touch</h3>

        <form id="contactForm" novalidate>
          <div class="field">
            <label class="sr-only" for="name">Emri</label>
            <input id="name" name="name" type="text" placeholder="Name" required>
          </div>

          <div class="field">
            <label class="sr-only" for="email">johns@example.com</label>
            <input id="email" name="email" type="email" placeholder="Email" required>
          </div>

          <div class="field">
            <label class="sr-only" for="subject">Subjekti</label>
            <input id="subject" name="subject" type="text" placeholder="Subject" required>
          </div>

          <div class="field">
            <label class="sr-only" for="message">Mesazhi</label>
            <textarea id="message" name="message" placeholder="Message" required></textarea>
          </div>

          <div style="display:flex; gap:12px; align-items:center;">
            <button type="submit" class="btn" id="sendBtn">Send Message</button>
            <div class="success" id="successMsg" role="status" aria-live="polite">Your message was sent. Thank you!</div>
          </div>

          <div class="note">We'll reply within 1–2 business days.</div>
        </form>
      </aside>

    </div>
  </main>
</body>
</html>
